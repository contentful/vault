name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The Release workflow runs these tests before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # core + compiler unit tests and the Robolectric integration tests. Signing, javadoc and
      # publishing only run in the "release" profile, so no GPG key is needed here.
      - name: Build and test
        run: ./mvnw -B verify
